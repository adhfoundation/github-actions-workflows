name: Build docker image

on:
  workflow_call:
    inputs:
      docker-build-args:
        required: false
        type: string
        description: docker build args
      docker-build-target:
        required: false
        type: string
        description: Docker Image target during build
      docker-build-context:
        required: false
        type: string
        description: Dockerfile dir
        default: '.'
      docker-file-path:
        required: false
        type: string
        description: Dockerfile path
        default: 'Dockerfile'
      docker-tag:
        required: true
        type: string
        description: Tag to be linked on ECR
      environment:
        required: true
        type: string
        description: Environment
      public-repository:
        required: false
        type: boolean
        description: Is the repository public?
        default: false
      scan-image:
        required: false
        type: boolean
        default: true
        description: Scan image with Trivy after build
      trivy-severity:
        required: false
        type: string
        default: 'CRITICAL,HIGH'
        description: Comma-separated severity levels to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)
      scout-command:
        required: false
        type: string
        default: quickview,cves,recommendations
        description: 'Deprecated: kept for backward compatibility, no longer used'

    secrets:
      GH_SCOUT_ACCESS_TOKEN:
        required: false
      GH_ACCESS_TOKEN:
        required: false
      PIP_EXTRA_INDEX_URL:
        required: false
      REQUIREMENTS:
        required: false
      DOCKERHUB_USER:
        required: false
      DOCKERHUB_PASSWORD:
        required: false
      GITHUB_APP_APPID:
        required: false
      GITHUB_APP_INSTALLATION_ID:
        required: false
      GITHUB_APP_PRIVATE_KEY:
        required: false
      NPM_TOKEN:
        required: false

env:
  TERM: xterm-256color

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.docker-tag }}" ]; then
            echo "docker-tag is required"
            exit 1
          fi
          if [ -z "${{ inputs.environment }}" ]; then
            echo "environment is required"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Check GitHub App secrets
        id: check-github-app
        shell: bash
        env:
          APP_ID: ${{ secrets.GITHUB_APP_APPID }}
          INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$INSTALLATION_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GitHub App secrets not configured, skipping token generation"
          fi

      - name: Generate GitHub App installation token
        if: steps.check-github-app.outputs.configured == 'true'
        id: app-token
        shell: bash
        env:
          APP_ID: ${{ secrets.GITHUB_APP_APPID }}
          INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        run: |-
          set -e
          NOW=$(date +%s)
          IAT=$((NOW - 60))
          EXP=$((NOW + 540))
          
          # Write private key to temp file
          KEY_FILE=$(mktemp)
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_FILE"
          
          if ! openssl rsa -in "$KEY_FILE" -check -noout 2>/dev/null; then
            echo "::error::Invalid private key format"
            rm -f "$KEY_FILE"
            exit 1
          fi
          chmod 600 "$KEY_FILE"
          
          # Base64URL helper
          b64url() {
            openssl base64 -e -A | tr '+/' '-_' | tr -d '='
          }
          
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$IAT" "$EXP" "$APP_ID" | b64url)
          UNSIGNED="$HEADER.$PAYLOAD"
          SIGNATURE=$(printf '%s' "$UNSIGNED" \
            | openssl dgst -sha256 -sign "$KEY_FILE" \
            | b64url)
          JWT="$UNSIGNED.$SIGNATURE"
          
          # Exchange JWT for installation token
          RESPONSE=$(curl -sL -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            -w "\n%{http_code}" \
            https://api.github.com/app/installations/$INSTALLATION_ID/access_tokens)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Failed to get installation token. HTTP $HTTP_CODE"
            echo "Response: $BODY"
            rm -f "$KEY_FILE"
            exit 1
          fi
          
          TOKEN=$(echo "$BODY" | jq -r '.token')
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Token is empty or null"
            rm -f "$KEY_FILE"
            exit 1
          fi
          
          echo "::notice::GitHub App token generated successfully"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          
          # Clean up
          rm -f "$KEY_FILE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CREDS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR Public
        if: inputs.public-repository == true
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Login to Private ECR ${{ vars.ECR_URL }}
        if: inputs.public-repository == false
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ECR_URL }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ inputs.docker-build-context }}
          target: ${{ inputs.docker-build-target }}
          file: ${{ inputs.docker-file-path }}
          tags: |
            ${{ vars.ECR_URL }}/${{ vars.ECR_REPO }}:latest
            ${{ vars.ECR_URL }}/${{ vars.ECR_REPO }}:${{ inputs.docker-tag }}
          build-args: |
            GH_ACCESS_TOKEN=${{ steps.app-token.outputs.token || secrets.GH_ACCESS_TOKEN }}
            PIP_EXTRA_INDEX_URL=${{ secrets.PIP_EXTRA_INDEX_URL }}
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            ${{ inputs.docker-build-args }}

      - name: Scan image with Trivy
        if: inputs.scan-image == true
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ECR_URL }}/${{ vars.ECR_REPO }}:${{ inputs.docker-tag }}
          format: json
          output: trivy-results.json
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Publish Trivy results to job summary
        if: inputs.scan-image == true && !cancelled()
        continue-on-error: true
        env:
          IMAGE_REF: ${{ vars.ECR_URL }}/${{ vars.ECR_REPO }}:${{ inputs.docker-tag }}
          SEVERITY: ${{ inputs.trivy-severity }}
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "## Trivy Scan" >> $GITHUB_STEP_SUMMARY
            echo "_Trivy não gerou saída._" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          CRITICAL=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[] | select(.Severity == "HIGH")] | length' trivy-results.json)
          MEDIUM=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[] | select(.Severity == "MEDIUM")] | length' trivy-results.json)
          LOW=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[] | select(.Severity == "LOW")] | length' trivy-results.json)
          TOTAL=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[]] | length' trivy-results.json)
          {
            echo "## Trivy Scan — \`${IMAGE_REF}\`"
            echo "> Severidades: \`${SEVERITY}\` · apenas vulnerabilidades com fix disponível"
            echo ""
            echo "| Severidade | Total |"
            echo "|---|---|"
            echo "| 🔴 Critical | ${CRITICAL} |"
            echo "| 🟠 High | ${HIGH} |"
            echo "| 🟡 Medium | ${MEDIUM} |"
            echo "| 🔵 Low | ${LOW} |"
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "✅ Nenhuma vulnerabilidade encontrada com fix disponível."
            else
              echo "### Vulnerabilidades"
              echo ""
              echo "| CVE | Severidade | Pacote | Versão instalada | Fix disponível |"
              echo "|---|---|---|---|---|"
              jq -r '
                .Results // [] | .[].Vulnerabilities // [] | .[] |
                "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(if .FixedVersion then .FixedVersion else "—" end) |"
              ' trivy-results.json
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Comment Trivy results on PR
        if: inputs.scan-image == true && github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          IMAGE_REF: ${{ vars.ECR_URL }}/${{ vars.ECR_REPO }}:${{ inputs.docker-tag }}
          SEVERITY: ${{ inputs.trivy-severity }}
        with:
          script: |
            const fs = require('fs');
            const imageRef = process.env.IMAGE_REF;
            const severity = process.env.SEVERITY;
            if (!fs.existsSync('trivy-results.json')) return;
            const data = JSON.parse(fs.readFileSync('trivy-results.json', 'utf8'));
            const vulns = (data.Results || []).flatMap(r => r.Vulnerabilities || []);
            const count = s => vulns.filter(v => v.Severity === s).length;
            const marker = '<!-- trivy-scan -->';
            let body = `${marker}\n## Trivy Scan — \`${imageRef}\`\n`;
            body += `> Severidades: \`${severity}\` · apenas vulnerabilidades com fix disponível\n\n`;
            body += `| Severidade | Total |\n|---|---|\n`;
            body += `| 🔴 Critical | ${count('CRITICAL')} |\n`;
            body += `| 🟠 High | ${count('HIGH')} |\n`;
            body += `| 🟡 Medium | ${count('MEDIUM')} |\n`;
            body += `| 🔵 Low | ${count('LOW')} |\n\n`;
            if (vulns.length === 0) {
              body += `✅ Nenhuma vulnerabilidade encontrada com fix disponível.`;
            } else {
              body += `### Vulnerabilidades\n\n`;
              body += `| CVE | Severidade | Pacote | Versão instalada | Fix disponível |\n|---|---|---|---|---|\n`;
              const rows = vulns.map(v =>
                `| ${v.VulnerabilityID} | ${v.Severity} | ${v.PkgName} | ${v.InstalledVersion} | ${v.FixedVersion || '—'} |`
              ).join('\n');
              const MAX = 55000;
              body += body.length + rows.length > MAX
                ? rows.substring(0, MAX - body.length) + '\n\n_...truncado. Veja o job summary para o relatório completo._'
                : rows;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Block PR on findings
        if: inputs.scan-image == true && github.event_name == 'pull_request' && steps.trivy-scan.outcome == 'failure'
        run: |
          echo "::error::Trivy encontrou vulnerabilidades ${{ inputs.trivy-severity }} na imagem. Revise o sumário do job para detalhes."
          exit 1
