name: Build docker image

on:
  workflow_call:
    inputs:
      docker-build-args:
        required: false
        type: string
        description: docker build args
      docker-build-target:
        required: false
        type: string
        description: Docker Image target during build
      docker-build-context:
        required: false
        type: string
        description: Dockerfile dir
        default: '.'
      docker-file-path:
        required: false
        type: string
        description: Dockerfile path
        default: 'Dockerfile'
      docker-tag:
        required: true
        type: string
        description: Tag to be linked on ECR
      environment:
        required: true
        type: string
        description: Environment
      public-repository:
        required: false
        type: boolean
        description: Is the repository public?
        default: false
      scan-image:
        required: false
        type: boolean
        default: true
        description: Scan image with Trivy
      trivy-severity:
        required: false
        type: string
        default: ''
        description: Comma-separated severities to report, e.g. "CRITICAL,HIGH". Empty reports every severity.
      trivy-exit-code:
        required: false
        type: string
        default: '0'
        description: Exit code Trivy returns when it finds a vulnerability. "0" keeps the scan non-blocking; "1" fails the step on any match.

    secrets:
      GH_ACCESS_TOKEN:
        required: false
      PIP_EXTRA_INDEX_URL:
        required: false
      REQUIREMENTS:
        required: false
      GITHUB_APP_APPID:
        required: false
      GITHUB_APP_INSTALLATION_ID:
        required: false
      GITHUB_APP_PRIVATE_KEY:
        required: false
      NPM_TOKEN:
        required: false

env:
  TERM: xterm-256color

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.docker-tag }}" ]; then
            echo "docker-tag is required"
            exit 1
          fi
          if [ -z "${{ inputs.environment }}" ]; then
            echo "environment is required"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Check GitHub App secrets
        id: check-github-app
        shell: bash
        env:
          APP_ID: ${{ secrets.GITHUB_APP_APPID }}
          INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$INSTALLATION_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GitHub App secrets not configured, skipping token generation"
          fi

      - name: Generate GitHub App installation token
        if: steps.check-github-app.outputs.configured == 'true'
        id: app-token
        shell: bash
        env:
          APP_ID: ${{ secrets.GITHUB_APP_APPID }}
          INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        run: |-
          set -e
          NOW=$(date +%s)
          IAT=$((NOW - 60))
          EXP=$((NOW + 540))
          
          # Write private key to temp file
          KEY_FILE=$(mktemp)
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_FILE"
          
          if ! openssl rsa -in "$KEY_FILE" -check -noout 2>/dev/null; then
            echo "::error::Invalid private key format"
            rm -f "$KEY_FILE"
            exit 1
          fi
          chmod 600 "$KEY_FILE"
          
          # Base64URL helper
          b64url() {
            openssl base64 -e -A | tr '+/' '-_' | tr -d '='
          }
          
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$IAT" "$EXP" "$APP_ID" | b64url)
          UNSIGNED="$HEADER.$PAYLOAD"
          SIGNATURE=$(printf '%s' "$UNSIGNED" \
            | openssl dgst -sha256 -sign "$KEY_FILE" \
            | b64url)
          JWT="$UNSIGNED.$SIGNATURE"
          
          # Exchange JWT for installation token
          RESPONSE=$(curl -sL -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            -w "\n%{http_code}" \
            https://api.github.com/app/installations/$INSTALLATION_ID/access_tokens)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Failed to get installation token. HTTP $HTTP_CODE"
            echo "Response: $BODY"
            rm -f "$KEY_FILE"
            exit 1
          fi
          
          TOKEN=$(echo "$BODY" | jq -r '.token')
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Token is empty or null"
            rm -f "$KEY_FILE"
            exit 1
          fi
          
          echo "::notice::GitHub App token generated successfully"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          
          # Clean up
          rm -f "$KEY_FILE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CREDS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR Public
        if: inputs.public-repository == true
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Login to Private ECR ${{ vars.ECR_URL }}
        if: inputs.public-repository == false
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ECR_URL }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ inputs.docker-build-context }}
          target: ${{ inputs.docker-build-target }}
          file: ${{ inputs.docker-file-path }}
          tags: |
            ${{ vars.ECR_URL }}/${{ vars.ECR_REPO }}:latest
            ${{ vars.ECR_URL }}/${{ vars.ECR_REPO }}:${{ inputs.docker-tag }}
          build-args: |
            GH_ACCESS_TOKEN=${{ steps.app-token.outputs.token || secrets.GH_ACCESS_TOKEN }}
            PIP_EXTRA_INDEX_URL=${{ secrets.PIP_EXTRA_INDEX_URL }}
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            ${{ inputs.docker-build-args }}

      # format: json (em vez de table) + output pra arquivo: evita a tabela gigante do Trivy
      # poluindo o log do step — o step abaixo lê esse arquivo e monta um resumo legível no
      # Job Summary. exit-code default "0" mantém o scan não-bloqueante (visibilidade, sem
      # travar o pipeline), igual o Docker Scout que ele substitui.
      - name: Scan Trivy
        if: ${{ inputs.scan-image == true }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ECR_URL }}/${{ vars.ECR_REPO }}:${{ inputs.docker-tag }}
          format: json
          output: trivy-results.json
          vuln-type: os,library
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-exit-code }}

      # if: always() é essencial aqui: se trivy-exit-code for "1" e houver vulnerabilidade, o
      # step acima falha — sem always(), o resumo nunca seria publicado na hora em que mais
      # importaria mostrá-lo.
      - name: Publicar resumo do Trivy no Job Summary
        if: ${{ always() && inputs.scan-image == true }}
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "::warning::trivy-results.json não foi encontrado — resumo não gerado."
            exit 0
          fi

          {
            echo "## 🔍 Trivy — scan de imagem"
            echo ""
            echo "**Imagem:** \`${{ vars.ECR_URL }}/${{ vars.ECR_REPO }}:${{ inputs.docker-tag }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)

          if [ "$TOTAL" -eq 0 ]; then
            echo "✅ Nenhuma vulnerabilidade encontrada." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "**$TOTAL vulnerabilidade(s) encontrada(s):**"
            echo ""
            for SEV in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
              COUNT=$(jq --arg sev "$SEV" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $sev)] | length' trivy-results.json)
              if [ "$COUNT" -gt 0 ]; then
                echo "- **$SEV:** $COUNT"
              fi
            done
            echo ""
            echo "| Severidade | Pacote | Instalada | Corrige em | CVE |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            [.Results[]? | .Vulnerabilities[]? |
              [.Severity, .PkgName, .InstalledVersion,
                (if (.FixedVersion // "") == "" then "-" else .FixedVersion end),
                (if .PrimaryURL then "[" + .VulnerabilityID + "](" + .PrimaryURL + ")" else .VulnerabilityID end)]
            ]
            | sort_by(
                if .[0] == "CRITICAL" then 0
                elif .[0] == "HIGH" then 1
                elif .[0] == "MEDIUM" then 2
                elif .[0] == "LOW" then 3
                else 4 end
              )
            | .[]
            | "| " + .[0] + " | " + .[1] + " | " + .[2] + " | " + .[3] + " | " + .[4] + " |"
          ' trivy-results.json >> "$GITHUB_STEP_SUMMARY"
