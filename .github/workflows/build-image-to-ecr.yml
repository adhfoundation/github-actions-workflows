name: Build docker image

on:
  workflow_call:
    inputs:
      aws-creds-role-to-assume:
        required: true
        type: string
        description: Role arn to assume without aws credentials
      aws-region:
        required: true
        type: string
        description: AWS Region
      docker-build-args:
        required: false
        type: string
        description: docker build args
      docker-build-target:
        required: false
        type: string
        description: Docker Image target during build
      docker-build-context:
        required: false
        type: string
        description: Dockerfile dir
        default: '.'
      docker-file-path:
        required: false
        type: string
        description: Dockerfile path
        default: 'Dockerfile'
      docker-tag:
        required: true
        type: string
        description: Tag to be linked on ECR
      ecr-url:
        required: true
        type: string
        description: ECR url to push images
      ecr-repo:
        required: true
        type: string
        description: ECR repository name
      scan-image:
        required: false
        type: boolean
        default: true
        description: Scan image with Trivy after build
      trivy-severity:
        required: false
        type: string
        default: 'CRITICAL,HIGH'
        description: Comma-separated severity levels to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)
      trivy-fail-on-findings:
        required: false
        type: boolean
        default: false
        description: Fail the build when vulnerabilities matching trivy-severity are found

    secrets:
      PIP_EXTRA_INDEX_URL:
        required: false
      GH_ACCESS_TOKEN:
        required: false
      REQUIREMENTS:
        required: false
      NEXT_PUBLIC_PORTAL_AFYA_API_BASE_URL:
        required: false
      NEXT_PUBLIC_BFF_AFYA_API_BASE_URL:
        required: false

jobs:

  build:
    runs-on: ubuntu-22.04
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2.1.0
        with:
          role-to-assume: ${{ inputs.aws-creds-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to ECR ${{ inputs.ecr-url }}
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.ecr-url }}

      - name: Build image
        uses: docker/build-push-action@v4.1.0
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ inputs.docker-build-context }}
          target: ${{ inputs.docker-build-target }}
          file: ${{ inputs.docker-file-path }}
          tags: |
            ${{ inputs.ecr-url }}/${{ inputs.ecr-repo }}:latest
            ${{ inputs.ecr-url }}/${{ inputs.ecr-repo }}:${{ inputs.docker-tag }}
          build-args: |
            GH_ACCESS_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
            PIP_EXTRA_INDEX_URL=${{ secrets.PIP_EXTRA_INDEX_URL }}
            REQUIREMENTS=${{ secrets.REQUIREMENTS }}
            NEXT_PUBLIC_PORTAL_AFYA_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_PORTAL_AFYA_API_BASE_URL }}
            NEXT_PUBLIC_BFF_AFYA_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_BFF_AFYA_API_BASE_URL }}
            ${{ inputs.docker-build-args }}

      - name: Scan image with Trivy
        if: inputs.scan-image == true
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.ecr-url }}/${{ inputs.ecr-repo }}:${{ inputs.docker-tag }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-fail-on-findings == true && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy results to GitHub Security
        if: inputs.scan-image == true && !cancelled()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Fail build on findings
        if: inputs.scan-image == true && inputs.trivy-fail-on-findings == true && steps.trivy-scan.outcome == 'failure'
        run: |
          echo "::error::Trivy found vulnerabilities with severity ${{ inputs.trivy-severity }}. Review the Security tab for details."
          exit 1