name: Build docker image

on:
  workflow_call:
    inputs:
      aws-creds-role-to-assume:
        required: true
        type: string
        description: Role arn to assume without aws credentials
      aws-region:
        required: true
        type: string
        description: AWS Region
      docker-build-args:
        required: false
        type: string
        description: docker build args
      docker-build-target:
        required: false
        type: string
        description: Docker Image target during build
      docker-build-context:
        required: false
        type: string
        description: Dockerfile dir
        default: '.'
      docker-file-path:
        required: false
        type: string
        description: Dockerfile path
        default: 'Dockerfile'
      docker-tag:
        required: true
        type: string
        description: Tag to be linked on ECR
      ecr-url:
        required: true
        type: string
        description: ECR url to push images
      ecr-repo:
        required: true
        type: string
        description: ECR repository name
      scan-image:
        required: false
        type: boolean
        default: true
        description: Scan image with Trivy after build
      trivy-severity:
        required: false
        type: string
        default: 'CRITICAL,HIGH'
        description: Comma-separated severity levels to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)
    secrets:
      PIP_EXTRA_INDEX_URL:
        required: false
      GH_ACCESS_TOKEN:
        required: false
      REQUIREMENTS:
        required: false
      NEXT_PUBLIC_PORTAL_AFYA_API_BASE_URL:
        required: false
      NEXT_PUBLIC_BFF_AFYA_API_BASE_URL:
        required: false

jobs:

  build:
    runs-on: ubuntu-22.04
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2.1.0
        with:
          role-to-assume: ${{ inputs.aws-creds-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to ECR ${{ inputs.ecr-url }}
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.ecr-url }}

      - name: Build image
        uses: docker/build-push-action@v4.1.0
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ inputs.docker-build-context }}
          target: ${{ inputs.docker-build-target }}
          file: ${{ inputs.docker-file-path }}
          tags: |
            ${{ inputs.ecr-url }}/${{ inputs.ecr-repo }}:latest
            ${{ inputs.ecr-url }}/${{ inputs.ecr-repo }}:${{ inputs.docker-tag }}
          build-args: |
            GH_ACCESS_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
            PIP_EXTRA_INDEX_URL=${{ secrets.PIP_EXTRA_INDEX_URL }}
            REQUIREMENTS=${{ secrets.REQUIREMENTS }}
            NEXT_PUBLIC_PORTAL_AFYA_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_PORTAL_AFYA_API_BASE_URL }}
            NEXT_PUBLIC_BFF_AFYA_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_BFF_AFYA_API_BASE_URL }}
            ${{ inputs.docker-build-args }}

      - name: Scan image with Trivy
        if: inputs.scan-image == true
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.ecr-url }}/${{ inputs.ecr-repo }}:${{ inputs.docker-tag }}
          format: json
          output: trivy-results.json
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Publish Trivy results to job summary
        if: inputs.scan-image == true && !cancelled()
        continue-on-error: true
        env:
          IMAGE_REF: ${{ inputs.ecr-url }}/${{ inputs.ecr-repo }}:${{ inputs.docker-tag }}
          SEVERITY: ${{ inputs.trivy-severity }}
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "## Trivy Scan" >> $GITHUB_STEP_SUMMARY
            echo "_Trivy não gerou saída._" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          CRITICAL=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[] | select(.Severity == "HIGH")] | length' trivy-results.json)
          MEDIUM=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[] | select(.Severity == "MEDIUM")] | length' trivy-results.json)
          LOW=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[] | select(.Severity == "LOW")] | length' trivy-results.json)
          TOTAL=$(jq '[.Results // [] | .[].Vulnerabilities // [] | .[]] | length' trivy-results.json)
          {
            echo "## Trivy Scan — \`${IMAGE_REF}\`"
            echo "> Severidades: \`${SEVERITY}\` · apenas vulnerabilidades com fix disponível"
            echo ""
            echo "| Severidade | Total |"
            echo "|---|---|"
            echo "| 🔴 Critical | ${CRITICAL} |"
            echo "| 🟠 High | ${HIGH} |"
            echo "| 🟡 Medium | ${MEDIUM} |"
            echo "| 🔵 Low | ${LOW} |"
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "✅ Nenhuma vulnerabilidade encontrada com fix disponível."
            else
              echo "### Vulnerabilidades"
              echo ""
              echo "| CVE | Severidade | Pacote | Versão instalada | Fix disponível |"
              echo "|---|---|---|---|---|"
              jq -r '
                .Results // [] | .[].Vulnerabilities // [] | .[] |
                "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(if .FixedVersion then .FixedVersion else "—" end) |"
              ' trivy-results.json
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Comment Trivy results on PR
        if: inputs.scan-image == true && github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          IMAGE_REF: ${{ inputs.ecr-url }}/${{ inputs.ecr-repo }}:${{ inputs.docker-tag }}
          SEVERITY: ${{ inputs.trivy-severity }}
        with:
          script: |
            const fs = require('fs');
            const imageRef = process.env.IMAGE_REF;
            const severity = process.env.SEVERITY;
            if (!fs.existsSync('trivy-results.json')) return;
            const data = JSON.parse(fs.readFileSync('trivy-results.json', 'utf8'));
            const vulns = (data.Results || []).flatMap(r => r.Vulnerabilities || []);
            const count = s => vulns.filter(v => v.Severity === s).length;
            const marker = '<!-- trivy-scan -->';
            let body = `${marker}\n## Trivy Scan — \`${imageRef}\`\n`;
            body += `> Severidades: \`${severity}\` · apenas vulnerabilidades com fix disponível\n\n`;
            body += `| Severidade | Total |\n|---|---|\n`;
            body += `| 🔴 Critical | ${count('CRITICAL')} |\n`;
            body += `| 🟠 High | ${count('HIGH')} |\n`;
            body += `| 🟡 Medium | ${count('MEDIUM')} |\n`;
            body += `| 🔵 Low | ${count('LOW')} |\n\n`;
            if (vulns.length === 0) {
              body += `✅ Nenhuma vulnerabilidade encontrada com fix disponível.`;
            } else {
              body += `### Vulnerabilidades\n\n`;
              body += `| CVE | Severidade | Pacote | Versão instalada | Fix disponível |\n|---|---|---|---|---|\n`;
              const rows = vulns.map(v =>
                `| ${v.VulnerabilityID} | ${v.Severity} | ${v.PkgName} | ${v.InstalledVersion} | ${v.FixedVersion || '—'} |`
              ).join('\n');
              const MAX = 55000;
              body += body.length + rows.length > MAX
                ? rows.substring(0, MAX - body.length) + '\n\n_...truncado. Veja o job summary para o relatório completo._'
                : rows;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Block PR on findings
        if: inputs.scan-image == true && github.event_name == 'pull_request' && steps.trivy-scan.outcome == 'failure'
        run: |
          echo "::error::Trivy encontrou vulnerabilidades ${{ inputs.trivy-severity }} na imagem. Revise o sumário do job para detalhes."
          exit 1